name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

# 同じブランチへの連続 push では古い実行を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux で回せる。本体の [deps] は KernelAbstractions と Atomix だけで、
        # macOS 専用の Metal も OpenGL を要する GLMakie も入っていない（#13）。
        # Manifest.toml は gitignore なので CI は Project.toml から解決し直す
        # ——つまりプラットフォーム依存のものが [deps] に無ければそれで足りる。
        os: [ubuntu-latest]
        # Project.toml の compat 下限 (1.10) と開発中のバージョン (1.12) を見る
        version: ['1.10', '1.12']

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
